[workspace]
members = [
    "client",
    "server", 
    "shared",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75.0"

[workspace.dependencies]
# 多语言支持
rust-i18n = "2.3"

# 异步运行时
tokio = { version = "1.35", features = ["full"] }
tokio-util = "0.7"

# 命令行工具
clap = { version = "4.4", features = ["derive"] }
crossterm = "0.27"

# 日志
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# 网络通信
tonic = "0.10"
prost = "0.12"

# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# 加密
aes-gcm = "0.10"
x25519-dalek = "2.0"
rand = "0.8"

# 文件系统
dirs = "5.0"

# 错误处理
anyhow = "1.0"
thiserror = "1.0"

# 测试
rstest = "0.18"
mockall = "0.12"
